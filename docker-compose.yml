version: '3.8'

services:
  skyflora-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyflora-pipeline-runner
    # Montamos os volumes para que as alterações no código e nos dados
    # reflitam imediatamente no container sem necessidade de rebuild.
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    security_opt:
      - seccomp=unconfined
    environment:
      - PYTHONPATH=/app/src
      - USE_LOCAL_CACHE=true
    # Comando explícito para executar o pipeline
    command: ["python", "src/pipeline/main.py"]
